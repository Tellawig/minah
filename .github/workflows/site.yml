# Publishes the site to GitHub Pages and refreshes the opportunities feed every day.
name: Site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC = 08:00 in Amman
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A failed source keeps its previous items, so the site still publishes.
      - name: Refresh feed from EURAXESS and CNRS
        if: github.event_name != 'push'
        continue-on-error: true
        run: python tools/update_feed.py

      - name: Save the refreshed feed
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet -- latest.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add latest.js
            git commit -m "Daily feed update"
            git push
          fi

      - name: Collect site files
        run: |
          mkdir _site
          cp index.html styles.css app.js chat.js data.js latest.js _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
